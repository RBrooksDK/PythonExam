name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: .github/build-environment.yml
          cache-environment: true

      - name: Build self-contained JupyterLite site
        shell: bash -l {0}
        run: |
          jupyter lite build --contents exam-content --output-dir dist
          test -f dist/lab/index.html
          test -f dist/notebooks/index.html

      - name: Smoke test offline Python packages
        shell: bash -l {0}
        run: |
          python -m pip install xnotebook==1.0.0
          xnb scripts/smoke.py -e environment.yml --timeout 300 --cell-timeout 180

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
